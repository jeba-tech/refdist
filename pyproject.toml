[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refdist"
version = "0.1.0"
description = "REFDIST: A Causal Reference-Swap Audit of False Positives in AI Text Detectors"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.56",
    "datasets>=2.18",
    "accelerate>=0.28",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "statsmodels==0.15.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "nltk>=3.8",
    "wordfreq==3.1.1",  # T2/T5 word lists are derived from its frequency tables
    "py7zr>=0.21",
    "tqdm>=4.66",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
refdist-audit = "refdist.audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["refdist*"]
